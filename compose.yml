services:
  postgres:
    image: postgres:16-alpine
    container_name: agendapro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agendapro
      POSTGRES_USER: agendapro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "5433:5432"
    volumes:
      - agendapro_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendapro -d agendapro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  agendapro_data:
