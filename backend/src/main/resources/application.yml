spring:
  application:
    name: agendapro
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/agendapro}
    username: ${DB_USERNAME:agendapro}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: America/Maceio
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 1800000